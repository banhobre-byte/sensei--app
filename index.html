<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sensei">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sensei — Sesión</title>
<style>
  :root{
    --bg:#0d0d0d; --bg-card:#161513; --bg-card-2:#1c1a17; --line:#2b2823;
    --gold:#e0a83e; --gold-dim:#8a6c2f; --text:#f2ede2; --text-dim:#9a9488;
    --red:#c1503f; --green:#5c8a5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior-y:none;}
  body{padding-bottom:110px;}
  .num{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}

  header{padding:22px 18px 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141210,#0d0d0d); position:sticky; top:0; z-index:10;}
  .brand{display:flex; align-items:baseline; justify-content:space-between;}
  .brand h1{margin:0; font-size:22px; letter-spacing:3px; font-weight:800;
    text-transform:uppercase; color:var(--gold);}
  .brand .badge{font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-dim); border:1px solid var(--line); border-radius:20px; padding:3px 9px;}
  .subline{margin-top:6px; font-size:13px; color:var(--text-dim);}
  .subline b{color:var(--text);}
  .staleflag{margin-top:8px; font-size:11px; color:#c98a7a; display:none;}
  .staleflag.show{display:block;}

  main{padding:16px 14px 0;}

  .warn-box{background:#1e1611; border:1px solid #4a3620; border-radius:10px;
    padding:10px 12px; margin-bottom:16px; font-size:12.5px; color:#d9b98a; line-height:1.5;}
  .warn-box b{color:var(--gold);}

  .rest-day{background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:18px; font-size:13.5px; line-height:1.6; color:var(--text-dim);}
  .rest-day .rd-title{color:var(--text); font-size:16px; font-weight:700; margin-bottom:8px;}

  .exercise{background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden;}
  .ex-head{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; cursor:pointer;}
  .ex-title{display:flex; align-items:center; gap:9px;}
  .ex-index{font-size:11px; color:var(--bg); background:var(--gold); width:20px; height:20px;
    border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;}
  .ex-name{font-size:15px; font-weight:600;}
  .ex-meta{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .chev{color:var(--text-dim); font-size:12px; transition:transform .2s;}
  .exercise.open .chev{transform:rotate(180deg);}
  .ex-note{font-size:11.5px; padding:0 14px 10px; color:#c98a7a; line-height:1.4;}
  .ex-body{display:none; padding:0 14px 14px;}
  .exercise.open .ex-body{display:block;}

  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 70px 30px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-label{font-size:12px; color:var(--text-dim); text-align:center;}
  .set-row input{width:100%; background:var(--bg-card-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:8px 6px; font-size:14px; text-align:center;}
  .set-row input:focus{outline:none; border-color:var(--gold-dim);}
  .set-row select{width:100%; background:var(--bg-card-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:8px 2px; font-size:12px;}
  .check-btn{width:30px; height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg-card-2); color:var(--text-dim); font-size:14px; display:flex; align-items:center; justify-content:center;}
  .check-btn.done{background:var(--green); border-color:var(--green); color:#0d0d0d;}
  .col-labels{display:grid; grid-template-columns:26px 1fr 1fr 70px 30px; gap:8px; margin-bottom:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);}
  .col-labels span{text-align:center;}
  .rest-tag{display:inline-block; margin-top:2px; font-size:10.5px; color:var(--gold-dim);
    border:1px solid var(--line); border-radius:20px; padding:2px 8px;}

  footer{position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(0deg,#0d0d0d 70%,rgba(13,13,13,0)); padding:18px 14px 22px;}
  .save-btn{width:100%; background:var(--gold); color:#0d0d0d; border:none; border-radius:12px;
    padding:15px; font-size:15px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .save-btn:active{opacity:.85;}
  .mock-note{text-align:center; font-size:10.5px; color:var(--text-dim); margin-top:8px;}

  .toast{position:fixed; left:14px; right:14px; bottom:100px; background:#1c1a17;
    border:1px solid var(--gold-dim); color:var(--text); padding:12px 14px; border-radius:10px;
    font-size:13px; transform:translateY(20px); opacity:0; pointer-events:none; transition:all .25s ease; z-index:20;}
  .toast.show{transform:translateY(0); opacity:1;}
  .loading{padding:40px 0; text-align:center; color:var(--text-dim); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Sensei</h1>
    <span class="badge">v2 · semanal</span>
  </div>
  <div class="subline" id="daySubline">Cargando sesión de hoy…</div>
  <div class="staleflag" id="staleFlag">⚠️ Sin conexión — mostrando la última sesión guardada, puede no ser la más reciente.</div>
</header>

<main id="main">
  <div class="loading">Cargando…</div>
</main>

<footer id="footer" style="display:none">
  <button class="save-btn" onclick="saveSession()">Guardar sesión</button>
  <div class="mock-note">Maqueta sin persistencia — al recargar se pierde. Fase 2: NAS.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  async function loadWeek(){
    const main = document.getElementById('main');
    const staleFlag = document.getElementById('staleFlag');
    let data, fromNetwork = true;
    try{
      const res = await fetch('week.json', {cache:'no-store'});
      if(!res.ok) throw new Error('bad response');
      data = await res.json();
    }catch(e){
      fromNetwork = false;
      try{
        const cache = await caches.open('sensei-v2');
        const cached = await cache.match('week.json');
        if(cached){ data = await cached.json(); }
      }catch(e2){ /* no cache either */ }
    }
    if(!data){
      main.innerHTML = '<div class="loading">No se pudo cargar la sesión. Revisa tu conexión.</div>';
      return;
    }
    if(!fromNetwork) staleFlag.classList.add('show');
    renderDay(data);
  }

  function todayISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function renderDay(data){
    const iso = todayISO();
    const jsDay = new Date().getDay(); // 0=domingo..6=sábado
    const day = (data.overrides && data.overrides[iso]) ? data.overrides[iso] : data.days[String(jsDay)];
    const main = document.getElementById('main');
    const footer = document.getElementById('footer');
    const subline = document.getElementById('daySubline');

    if(!day){
      subline.innerHTML = DIAS[jsDay];
      main.innerHTML = '<div class="rest-day"><div class="rd-title">Sin sesión definida</div>Hoy no hay datos cargados para este día.</div>';
      return;
    }

    subline.innerHTML = `<b>${day.title}</b> · ${day.subtitle}`;

    let html = '';
    if(day.warn){
      html += `<div class="warn-box"><b>⚠️</b> ${day.warn}</div>`;
    }

    if(day.type === 'cardio' || day.type === 'descanso'){
      html += `<div class="rest-day"><div class="rd-title">${day.title}</div>${day.note || ''}</div>`;
      main.innerHTML = html;
      footer.style.display = 'none';
      return;
    }

    // fuerza: render exercises
    html += `<div class="col-labels"><span>#</span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>`;

    day.exercises.forEach((ex, i) => {
      const openClass = i === 0 ? ' open' : '';
      html += `<div class="exercise${openClass}" data-ex="${i}">
        <div class="ex-head" onclick="toggleEx(this)">
          <div class="ex-title">
            <span class="ex-index">${i+1}</span>
            <div>
              <div class="ex-name">${ex.name}</div>
              <div class="ex-meta">${ex.meta || ''}</div>
            </div>
          </div>
          <span class="chev">▾</span>
        </div>`;
      if(ex.warnEx){
        html += `<div class="ex-note">${ex.warnEx}</div>`;
      }
      html += `<div class="ex-body">
        <div class="rest-tag">Descanso ${ex.rest || ''}</div>
        <div style="height:8px"></div>`;
      ex.sets.forEach((s, si) => {
        const kgVal = s.kg !== undefined && s.kg !== '' ? `value="${s.kg}"` : `placeholder="${s.label || 'kg'}"`;
        const repsVal = s.reps !== undefined && s.reps !== '' ? `value="${s.reps}"` : `placeholder="reps"`;
        html += `<div class="set-row">
          <span class="set-label">${si+1}</span>
          <input type="number" ${kgVal}>
          <input type="number" ${repsVal}>
          <select>
            <option${s.rir==='0'?' selected':''}>RIR 0</option>
            <option${s.rir==='1'?' selected':''}>RIR 1</option>
            <option${s.rir==='2'?' selected':''}>RIR 2</option>
            <option${s.rir==='3'?' selected':''}>RIR 3</option>
            <option${s.rir==='4'?' selected':''}>RIR 4</option>
          </select>
          <button class="check-btn${(s.reps !== undefined && s.reps !== '') ? ' done' : ''}" onclick="toggleDone(this)">✓</button>
        </div>`;
      });
      html += `</div></div>`;
    });

    main.innerHTML = html;
    footer.style.display = 'block';
  }

  function toggleEx(headEl){ headEl.parentElement.classList.toggle('open'); }
  function toggleDone(btn){ btn.classList.toggle('done'); }
  function saveSession(){
    const t = document.getElementById('toast');
    t.textContent = 'Sesión registrada en memoria del navegador (temporal). Sin backend todavía — fase 2 con el NAS lo hará permanente.';
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 3800);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
    });
  }

  loadWeek();
</script>

</body>
</html>
