<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sensei">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sensei — Sesión</title>
<style>
  :root{
    --bg:#0d0d0d; --bg-card:#161513; --bg-card-2:#1c1a17; --line:#2b2823;
    --gold:#e0a83e; --gold-dim:#8a6c2f; --text:#f2ede2; --text-dim:#9a9488;
    --red:#c1503f; --green:#5c8a5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior-y:none;}
  body{padding-bottom:110px;}
  .num{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}

  header{padding:22px 18px 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141210,#0d0d0d); position:sticky; top:0; z-index:10;}
  .brand{display:flex; align-items:baseline; justify-content:space-between;}
  .brand h1{margin:0; font-size:22px; letter-spacing:3px; font-weight:800;
    text-transform:uppercase; color:var(--gold);}
  .brand .badge{font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-dim); border:1px solid var(--line); border-radius:20px; padding:3px 9px;}
  .subline{margin-top:6px; font-size:13px; color:var(--text-dim);}
  .subline b{color:var(--text);}
  .staleflag{margin-top:8px; font-size:11px; color:#c98a7a; display:none;}
  .staleflag.show{display:block;}

  main{padding:16px 14px 0;}

  .warn-box{background:#1e1611; border:1px solid #4a3620; border-radius:10px;
    padding:10px 12px; margin-bottom:16px; font-size:12.5px; color:#d9b98a; line-height:1.5;}
  .warn-box b{color:var(--gold);}

  .rest-day{background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:18px; font-size:13.5px; line-height:1.6; color:var(--text-dim);}
  .rest-day .rd-title{color:var(--text); font-size:16px; font-weight:700; margin-bottom:8px;}

  .exercise{background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden;}
  .ex-head{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; cursor:pointer;}
  .ex-title{display:flex; align-items:center; gap:9px;}
  .ex-index{font-size:11px; color:var(--bg); background:var(--gold); width:20px; height:20px;
    border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;}
  .ex-name{font-size:15px; font-weight:600;}
  .ex-meta{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .chev{color:var(--text-dim); font-size:12px; transition:transform .2s;}
  .exercise.open .chev{transform:rotate(180deg);}
  .ex-note{font-size:11.5px; padding:0 14px 10px; color:#c98a7a; line-height:1.4;}
  .ex-body{display:none; padding:0 14px 14px;}
  .exercise.open .ex-body{display:block;}

  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 70px 30px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-label{font-size:12px; color:var(--text-dim); text-align:center;}
  .set-row input{width:100%; background:var(--bg-card-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:8px 6px; font-size:14px; text-align:center;}
  .set-row input:focus{outline:none; border-color:var(--gold-dim);}
  .set-row select{width:100%; background:var(--bg-card-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:8px 2px; font-size:12px;}
  .check-btn{width:30px; height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg-card-2); color:var(--text-dim); font-size:14px; display:flex; align-items:center; justify-content:center;}
  .check-btn.done{background:var(--green); border-color:var(--green); color:#0d0d0d;}
  .col-labels{display:grid; grid-template-columns:26px 1fr 1fr 70px 30px; gap:8px; margin-bottom:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);}
  .col-labels span{text-align:center;}
  .rest-tag{display:inline-block; margin-top:2px; font-size:10.5px; color:var(--gold-dim);
    border:1px solid var(--line); border-radius:20px; padding:2px 8px;}

  footer{position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(0deg,#0d0d0d 70%,rgba(13,13,13,0)); padding:18px 14px 22px;}
  .save-btn{width:100%; background:var(--gold); color:#0d0d0d; border:none; border-radius:12px;
    padding:15px; font-size:15px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .save-btn:active{opacity:.85;}
  .mock-note{text-align:center; font-size:10.5px; color:var(--text-dim); margin-top:8px;}

  .toast{position:fixed; left:14px; right:14px; bottom:100px; background:#1c1a17;
    border:1px solid var(--gold-dim); color:var(--text); padding:12px 14px; border-radius:10px;
    font-size:13px; transform:translateY(20px); opacity:0; pointer-events:none; transition:all .25s ease; z-index:20;}
  .toast.show{transform:translateY(0); opacity:1;}
  .loading{padding:40px 0; text-align:center; color:var(--text-dim); font-size:13px;}

  .rest-overlay{position:fixed; inset:0; z-index:40; background:radial-gradient(circle at 50% 40%, #1c1810, #0d0d0d 70%);
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center;}
  .rest-overlay.show{display:flex;}
  .rest-close-btn{position:absolute; top:22px; right:22px; width:38px; height:38px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim); font-size:16px;}
  .rest-sub2{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim);}
  .rest-ex-name2{font-size:24px; font-weight:800; color:var(--gold); margin-top:8px; max-width:90%; line-height:1.3;}
  .rest-next2{font-size:13px; color:var(--text-dim); margin-top:18px; max-width:85%;}
  .rest-time2{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:104px; font-weight:800;
    color:var(--text); margin:26px 0; letter-spacing:-2px;}
  .rest-time2.low{color:var(--red);}
  .rest-controls{display:flex; gap:16px; align-items:center; margin-bottom:18px;}
  .rest-adj-btn{width:58px; height:58px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-card); color:var(--gold); font-size:14px; font-weight:800;}
  .rest-adj-btn:active{background:var(--bg-card-2);}
  .rest-reset-btn{padding:12px 22px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-card-2); color:var(--text-dim); font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:30;
    display:none; align-items:flex-end; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal-card{background:var(--bg-card); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:520px; padding:18px 16px 24px; max-height:80vh; display:flex; flex-direction:column;}
  .modal-title{font-size:16px; font-weight:800; color:var(--gold); margin-bottom:10px;
    text-transform:uppercase; letter-spacing:1px;}
  .modal-textarea{background:var(--bg-card-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:12.5px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    padding:12px; width:100%; flex:1; min-height:220px; resize:none; line-height:1.6;}
  .modal-actions{display:flex; gap:10px; margin-top:14px;}
  .modal-btn{flex:1; padding:13px; border-radius:10px; border:none; font-size:13.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px;}
  .modal-btn.copy{background:var(--gold); color:#0d0d0d;}
  .modal-btn.close{background:var(--bg-card-2); color:var(--text-dim); border:1px solid var(--line);}

  .day-selector{display:flex; gap:6px; margin-top:14px;}
  .day-btn{flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--bg-card); color:var(--text-dim); font-size:12px; font-weight:700;
    text-align:center; position:relative;}
  .day-btn.active{background:var(--gold); border-color:var(--gold); color:#0d0d0d;}
  .day-btn .day-dot{position:absolute; top:3px; right:3px; width:5px; height:5px;
    border-radius:50%; background:var(--gold);}
  .day-btn.active .day-dot{background:#0d0d0d;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Sensei</h1>
    <span class="badge">v2 · semanal</span>
  </div>
  <div class="subline" id="daySubline">Cargando sesión de hoy…</div>
  <div class="staleflag" id="staleFlag">⚠️ Sin conexión — mostrando la última sesión guardada, puede no ser la más reciente.</div>
  <div class="day-selector" id="daySelector"></div>
</header>

<main id="main">
  <div class="loading">Cargando…</div>
</main>

<footer id="footer" style="display:none">
  <button class="save-btn" onclick="saveSession()">Guardar sesión</button>
  <div class="mock-note">Genera un resumen para copiar y pegar en Sensei. Sin guardado permanente aún — fase 2: NAS.</div>
</footer>

<div class="toast" id="toast"></div>

<div class="rest-overlay" id="restBar">
  <button class="rest-close-btn" onclick="cancelRestTimer()">✕</button>
  <div class="rest-sub2">Descanso</div>
  <div class="rest-ex-name2" id="restLabel"></div>
  <div class="rest-time2" id="restTime">0:00</div>
  <div class="rest-controls">
    <button class="rest-adj-btn" onclick="adjustRest(-15)">−15</button>
    <button class="rest-adj-btn" onclick="adjustRest(15)">+15</button>
  </div>
  <button class="rest-reset-btn" onclick="resetRest()">↺ Reiniciar</button>
  <div class="rest-next2" id="restNext"></div>
</div>

<div class="modal-overlay" id="summaryModal">
  <div class="modal-card">
    <div class="modal-title">Resumen de la sesión</div>
    <textarea class="modal-textarea" id="summaryText" readonly></textarea>
    <div class="modal-actions">
      <button class="modal-btn close" onclick="closeSummary()">Cerrar</button>
      <button class="modal-btn copy" onclick="copySummary()">Copiar</button>
    </div>
  </div>
</div>

<script>
  const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const DIAS_CORTO = ['D','L','M','X','J','V','S'];
  let weekDataGlobal = null;
  let selectedWeekday = new Date().getDay(); // 0=domingo..6=sábado, día que se está mostrando ahora

  async function loadWeek(){
    const main = document.getElementById('main');
    const staleFlag = document.getElementById('staleFlag');
    let data, fromNetwork = true;
    try{
      const res = await fetch('week.json', {cache:'no-store'});
      if(!res.ok) throw new Error('bad response');
      data = await res.json();
    }catch(e){
      fromNetwork = false;
      try{
        const cache = await caches.open('sensei-v8');
        const cached = await cache.match('week.json');
        if(cached){ data = await cached.json(); }
      }catch(e2){ /* no cache either */ }
    }
    if(!data){
      main.innerHTML = '<div class="loading">No se pudo cargar la sesión. Revisa tu conexión.</div>';
      return;
    }
    if(!fromNetwork) staleFlag.classList.add('show');
    weekDataGlobal = data;
    renderDaySelector();
    renderDay(data, selectedWeekday);
  }

  // Calcula la fecha real (dentro de la semana en curso, domingo-sábado) para un día de la semana dado
  function dateForWeekday(weekday){
    const today = new Date();
    const diff = weekday - today.getDay();
    const target = new Date(today);
    target.setDate(today.getDate() + diff);
    return target;
  }

  function isoForWeekday(weekday){
    return isoFromDate(dateForWeekday(weekday));
  }

  function isoFromDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function renderDaySelector(){
    const todayWeekday = new Date().getDay();
    const sel = document.getElementById('daySelector');
    let html = '';
    for(let w = 1; w <= 7; w++){
      const weekday = w % 7; // recorre Lunes(1)...Sábado(6),Domingo(0)
      const isToday = weekday === todayWeekday;
      const isActive = weekday === selectedWeekday;
      html += `<button class="day-btn${isActive ? ' active' : ''}" onclick="selectDay(${weekday})">
        ${DIAS_CORTO[weekday]}${isToday ? '<span class="day-dot"></span>' : ''}
      </button>`;
    }
    sel.innerHTML = html;
  }

  function selectDay(weekday){
    selectedWeekday = weekday;
    renderDaySelector();
    renderDay(weekDataGlobal, weekday);
  }

  function todayISO(){
    return isoFromDate(new Date());
  }

  // ---- Guardado local (protege la sesión si Android mata la pestaña en 2º plano) ----
  function progressKey(iso){ return `sensei_progress_${iso}`; }

  function applySavedProgress(day, iso){
    if(!day.exercises) return day;
    let saved;
    try{
      const raw = localStorage.getItem(progressKey(iso));
      if(!raw) return day;
      saved = JSON.parse(raw);
    }catch(e){ return day; }

    day.exercises.forEach((ex, ei) => {
      const savedEx = saved[ei];
      if(!savedEx) return;
      ex.sets.forEach((s, si) => {
        const savedSet = savedEx[si];
        if(!savedSet) return;
        if(savedSet.kg !== undefined && savedSet.kg !== '') s.kg = savedSet.kg;
        if(savedSet.reps !== undefined && savedSet.reps !== '') s.reps = savedSet.reps;
        if(savedSet.rir !== undefined) s.rir = savedSet.rir;
        if(savedSet.done) s.done = true;
      });
    });
    return day;
  }

  function saveProgress(){
    try{
      const iso = isoForWeekday(selectedWeekday);
      const data = {};
      document.querySelectorAll('.exercise').forEach((exDiv, ei) => {
        const rows = exDiv.querySelectorAll('.set-row');
        const exData = {};
        rows.forEach((row, si) => {
          const inputs = row.querySelectorAll('input');
          const kg = inputs[0].value;
          const reps = inputs[1].value;
          const rir = row.querySelector('select').value;
          const done = row.querySelector('.check-btn').classList.contains('done');
          if(kg !== '' || reps !== '' || done){
            exData[si] = { kg, reps, rir, done };
          }
        });
        if(Object.keys(exData).length) data[ei] = exData;
      });
      localStorage.setItem(progressKey(iso), JSON.stringify(data));
    }catch(e){ /* almacenamiento no disponible, se sigue sin guardado local */ }
  }

  function renderDay(data, weekday){
    const iso = isoForWeekday(weekday);
    const jsDay = weekday;
    let day = (data.overrides && data.overrides[iso]) ? data.overrides[iso] : data.days[String(jsDay)];
    const main = document.getElementById('main');
    const footer = document.getElementById('footer');
    const subline = document.getElementById('daySubline');

    if(!day){
      subline.innerHTML = DIAS[jsDay];
      main.innerHTML = '<div class="rest-day"><div class="rd-title">Sin sesión definida</div>No hay datos cargados para este día.</div>';
      return;
    }

    day = applySavedProgress(day, iso);

    subline.innerHTML = `<b>${day.title}</b> · ${day.subtitle}`;

    let html = '';
    if(day.warn){
      html += `<div class="warn-box"><b>⚠️</b> ${day.warn}</div>`;
    }

    const hasExercises = Array.isArray(day.exercises) && day.exercises.length > 0;

    if(!hasExercises){
      html += `<div class="rest-day"><div class="rd-title">${day.title}</div>${day.note || ''}</div>`;
      main.innerHTML = html;
      footer.style.display = 'none';
      return;
    }

    if(day.note){
      html += `<div class="rest-day" style="margin-bottom:14px; padding:14px 16px;">${day.note}</div>`;
    }

    // render exercises (fuerza, o descanso con protocolo cronometrado)
    html += `<div class="col-labels"><span>#</span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>`;

    day.exercises.forEach((ex, i) => {
      const openClass = i === 0 ? ' open' : '';
      const restSeconds = parseRestSeconds(ex.rest);
      html += `<div class="exercise${openClass}" data-ex="${i}" data-rest="${restSeconds}">
        <div class="ex-head" onclick="toggleEx(this)">
          <div class="ex-title">
            <span class="ex-index">${i+1}</span>
            <div>
              <div class="ex-name">${ex.name}</div>
              <div class="ex-meta">${ex.meta || ''}</div>
            </div>
          </div>
          <span class="chev">▾</span>
        </div>`;
      if(ex.warnEx){
        html += `<div class="ex-note">${ex.warnEx}</div>`;
      }
      html += `<div class="ex-body">
        <div class="rest-tag">Descanso ${ex.rest || ''}</div>
        <div style="height:8px"></div>`;
      ex.sets.forEach((s, si) => {
        const kgVal = s.kg !== undefined && s.kg !== '' ? `value="${s.kg}"` : `placeholder="${s.label || 'kg'}"`;
        const repsPlaceholder = s.repsLabel || 'reps';
        const repsVal = s.reps !== undefined && s.reps !== '' ? `value="${s.reps}"` : `placeholder="${repsPlaceholder}"`;
        const isDone = (s.reps !== undefined && s.reps !== '') || s.done;
        html += `<div class="set-row">
          <span class="set-label">${si+1}</span>
          <input type="number" ${kgVal} oninput="saveProgress()">
          <input type="number" ${repsVal} oninput="saveProgress()">
          <select onchange="saveProgress()">
            <option${s.rir==='-'?' selected':''}>—</option>
            <option${s.rir==='0'?' selected':''}>RIR 0</option>
            <option${s.rir==='1'?' selected':''}>RIR 1</option>
            <option${s.rir==='2'?' selected':''}>RIR 2</option>
            <option${s.rir==='3'?' selected':''}>RIR 3</option>
            <option${s.rir==='4'?' selected':''}>RIR 4</option>
          </select>
          <button class="check-btn${isDone ? ' done' : ''}" onclick="toggleDone(this)">✓</button>
        </div>`;
      });
      html += `</div></div>`;
    });

    main.innerHTML = html;
    footer.style.display = 'block';
  }

  function toggleEx(headEl){ headEl.parentElement.classList.toggle('open'); }

  // ---- Crono de descanso ----
  // Reglas Sensei: aislamiento 60s, resto general 90s, multiarticulares pesados 120s
  function parseRestSeconds(restText){
    if(!restText) return 90;
    if(restText.includes('2-3')) return 120;      // multiarticulares pesados
    if(restText.includes('90-120')) return 90;     // resto general
    if(restText.includes('60-90')) return 60;      // aislamiento
    return 90;
  }

  let restInterval = null;
  let restRemaining = 0;
  let restOriginalSeconds = 90;
  let restNextInfo = null;
  let restSpoken = new Set();

  function toggleDone(btn){
    const willBeDone = !btn.classList.contains('done');
    btn.classList.toggle('done');
    saveProgress();
    if(willBeDone){
      const exDiv = btn.closest('.exercise');
      const restSec = parseInt(exDiv.dataset.rest || '90', 10);
      const name = exDiv.querySelector('.ex-name').textContent;
      const nextInfo = computeNextSetLabel(btn);
      startRestTimer(restSec, name, nextInfo);
    }
  }

  // Averigua qué serie/ejercicio toca justo después de la que se acaba de marcar
  function computeNextSetLabel(btn){
    const exDiv = btn.closest('.exercise');
    const row = btn.closest('.set-row');
    const rows = Array.from(exDiv.querySelectorAll('.set-row'));
    const rowIdx = rows.indexOf(row);

    if(rowIdx < rows.length - 1){
      return { name: exDiv.querySelector('.ex-name').textContent, setNum: rowIdx + 2 };
    }
    const allExercises = Array.from(document.querySelectorAll('.exercise'));
    const exIdx = allExercises.indexOf(exDiv);
    if(exIdx < allExercises.length - 1){
      const nextEx = allExercises[exIdx + 1];
      return { name: nextEx.querySelector('.ex-name').textContent, setNum: 1 };
    }
    return null; // era la última serie de la sesión
  }

  function startRestTimer(seconds, label, nextInfo){
    clearInterval(restInterval);
    restRemaining = seconds;
    restOriginalSeconds = seconds;
    restNextInfo = nextInfo;
    restSpoken = new Set();
    document.getElementById('restLabel').textContent = label;
    document.getElementById('restNext').textContent = nextInfo
      ? `Siguiente: ${nextInfo.name} — serie ${nextInfo.setNum}`
      : 'Última serie de la sesión';
    document.getElementById('restBar').classList.add('show');
    updateRestDisplay();
    restInterval = setInterval(() => {
      restRemaining--;
      updateRestDisplay();
      if(restRemaining > 0 && restRemaining <= 5 && !restSpoken.has(restRemaining)){
        restSpoken.add(restRemaining);
        speak(String(restRemaining));
      }
      if(restRemaining <= 0){
        clearInterval(restInterval);
        finishRest();
      }
    }, 1000);
  }

  function finishRest(){
    beep();
    if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
    const msg = restNextInfo
      ? `${restNextInfo.name}, serie ${restNextInfo.setNum}`
      : 'Descanso terminado.';
    setTimeout(() => speak(msg), 500);
    setTimeout(() => document.getElementById('restBar').classList.remove('show'), 2200);
  }

  function adjustRest(delta){
    restRemaining = Math.max(0, restRemaining + delta);
    restSpoken.forEach(n => { if(n > restRemaining) restSpoken.delete(n); });
    updateRestDisplay();
  }

  function resetRest(){
    restRemaining = restOriginalSeconds;
    restSpoken = new Set();
    updateRestDisplay();
  }

  function updateRestDisplay(){
    const r = Math.max(restRemaining, 0);
    const m = Math.floor(r/60);
    const s = r % 60;
    const timeEl = document.getElementById('restTime');
    timeEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
    timeEl.classList.toggle('low', r <= 5 && r > 0);
  }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel(); // evita que se amontonen frases
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.rate = 1;
      speechSynthesis.speak(utter);
    }catch(e){ /* voz no disponible */ }
  }

  function cancelRestTimer(){
    clearInterval(restInterval);
    if('speechSynthesis' in window) speechSynthesis.cancel();
    document.getElementById('restBar').classList.remove('show');
  }

  function beep(){
    try{
      const playTone = (delay) => setTimeout(() => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      }, delay);
      playTone(0);
      playTone(550);
      playTone(1100);
    }catch(e){ /* audio no disponible */ }
  }

  // ---- Resumen de sesión ----
  function buildSummary(){
    const titleEl = document.querySelector('.subline b');
    const dayTitle = titleEl ? titleEl.textContent : 'Sesión';
    const viewedDate = dateForWeekday(selectedWeekday);
    const fecha = viewedDate.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
    let lines = [`${dayTitle} — ${fecha}`, ''];

    document.querySelectorAll('.exercise').forEach(exDiv => {
      const name = exDiv.querySelector('.ex-name').textContent;
      const rows = exDiv.querySelectorAll('.set-row');
      const setLines = [];
      rows.forEach((row, idx) => {
        const inputs = row.querySelectorAll('input');
        const kg = inputs[0].value.trim();
        const reps = inputs[1].value.trim();
        const rir = row.querySelector('select').value.replace('RIR ', 'rir');
        if(reps !== ''){
          setLines.push(`${idx+1}a ${kg || '-'}x${reps} ${rir}`);
        }
      });
      if(setLines.length){
        lines.push(`${name}: ${setLines.join(', ')}`);
      }
    });

    if(lines.length === 2){
      lines.push('(sin series registradas todavía)');
    }
    return lines.join('\n');
  }

  function saveSession(){
    const summary = buildSummary();
    document.getElementById('summaryText').value = summary;
    document.getElementById('summaryModal').classList.add('show');
  }

  function closeSummary(){
    document.getElementById('summaryModal').classList.remove('show');
  }

  async function copySummary(){
    const text = document.getElementById('summaryText').value;
    const t = document.getElementById('toast');
    try{
      await navigator.clipboard.writeText(text);
      t.textContent = 'Copiado — pégalo en la conversación de Sensei.';
    }catch(e){
      // Fallback para navegadores sin permiso de portapapeles
      const ta = document.getElementById('summaryText');
      ta.select();
      document.execCommand('copy');
      t.textContent = 'Copiado — pégalo en la conversación de Sensei.';
    }
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
    });
  }

  loadWeek();
</script>
